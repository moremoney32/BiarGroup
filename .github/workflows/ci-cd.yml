name: CI/CD — BIAR Actor Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── CI Backend ─────────────────────────────────────────────────────
  ci-backend:
    name: CI Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Linter
        working-directory: backend
        run: npm run lint

      # Ajouter ici : npm test — quand les tests seront écrits

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

  # ── CI Frontend ────────────────────────────────────────────────────
  ci-frontend:
    name: CI Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Linter
        working-directory: frontend
        run: npm run lint

      # Ajouter ici : npm test — quand les tests seront écrits

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── CD Deploy — uniquement sur push main (pas les PRs) ────────────
  deploy:
    name: Deploy VPS
    needs: [ci-backend, ci-frontend]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Déployer
        run: |
          cd /home/biar/BiarGroup
          git pull origin main
          docker compose up -d --build backend frontend
          docker compose ps
          echo "✅ Déployé avec succès"
